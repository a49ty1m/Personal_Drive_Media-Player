<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}☁️ My Drive + 🎬 Media Player{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/drive.css">
  {% block head %}{% endblock %}
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="/browse/">☁️ My Drive + 🎬 Media Player</a>
    </div>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/upload.js"></script>
  <script src="/static/js/delete.js"></script>
  <script src="/static/js/menu.js"></script>
  <script src="/static/js/folder.js"></script>
  <script src="/static/js/rename.js"></script>
  {% block scripts %}{% endblock %}

</body>
</html>
