<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}☁️ My Drive + 🎬 Media Player{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css?v=11">
  <link rel="stylesheet" href="/static/css/drive.css?v=11">
  {% block head %}{% endblock %}
</head>
<body>

  <nav class="top-nav">
    <div class="nav-brand">
      <div class="nav-brand-icon">🎬</div>
      <span>My Drive Media</span>
    </div>
    <div class="nav-menu">
      <a href="/browse/" class="nav-link {% if request.path.startswith('/browse') and not request.path.startswith('/player') %}active{% endif %}">🏠 Home</a>
      <a href="/starred/" class="nav-link {% if request.path.startswith('/starred') %}active{% endif %}">⭐ Starred</a>
      <a href="/recent/" class="nav-link {% if request.path.startswith('/recent') %}active{% endif %}">🕒 Recent</a>
    </div>
    <div class="nav-actions">
      <input type="text" class="search-input" placeholder="Search files..." id="searchInput">
    </div>
  </nav>

  <!-- System Info Bar -->
  <div class="system-info-bar" id="systemInfoBar">
    <div class="system-stat">
      <span class="stat-icon">🖥️</span>
      <span class="stat-label">CPU:</span>
      <span class="stat-value" id="cpuUsage">--</span>
    </div>
    <div class="system-stat">
      <span class="stat-icon">🧠</span>
      <span class="stat-label">RAM:</span>
      <span class="stat-value" id="ramUsage">--</span>
    </div>
    <div class="system-stat">
      <span class="stat-icon">💾</span>
      <span class="stat-label">Storage:</span>
      <span class="stat-value" id="storageUsage">--</span>
    </div>
    <div class="system-stat">
      <span class="stat-icon">📹</span>
      <span class="stat-label">Active:</span>
      <span class="stat-value" id="activeTranscodes">0</span>
    </div>
    <div class="system-stat">
      <span class="stat-icon">⏱️</span>
      <span class="stat-label">Uptime:</span>
      <span class="stat-value" id="systemUptime">--</span>
    </div>
  </div>

  <main class="wrapper">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/utils.js?v=11"></script>
  <script src="/static/js/upload.js?v=11"></script>
  <script src="/static/js/delete.js?v=11"></script>
  <script src="/static/js/menu.js?v=11"></script>
  <script src="/static/js/folder.js?v=11"></script>
  <script src="/static/js/rename.js?v=11"></script>
  
  <!-- System Info Auto-Update -->
  <script>
    (function() {
      function updateSystemInfo() {
        fetch('/api/system-info')
          .then(response => response.json())
          .then(data => {
            // Check if psutil is available
            if (data.psutil_available === false) {
              // Show message instead of stats
              document.getElementById('cpuUsage').textContent = 'N/A';
              document.getElementById('ramUsage').textContent = 'Install psutil';
              document.getElementById('storageUsage').textContent = 'pip install psutil';
              document.getElementById('activeTranscodes').textContent = '0 jobs';
              document.getElementById('systemUptime').textContent = 'N/A';
              return;
            }
            
            // CPU
            const cpuPercent = data.cpu.usage_percent;
            if (cpuPercent === null || cpuPercent === undefined) {
              document.getElementById('cpuUsage').textContent = 'N/A';
              document.getElementById('cpuUsage').style.color = '#8b9ba8';
            } else {
              document.getElementById('cpuUsage').textContent = cpuPercent + '%';
            }
            
            // RAM
            const ramPercent = data.memory.percent;
            const ramUsed = data.memory.used_mb;
            const ramTotal = data.memory.total_mb;
            document.getElementById('ramUsage').textContent = 
              Math.round(ramUsed) + '/' + Math.round(ramTotal) + ' MB (' + ramPercent + '%)';
            
            // Storage
            const storagePercent = data.storage.media_root.percent;
            const storageFree = data.storage.media_root.free_gb;
            const storageTotal = data.storage.media_root.total_gb;
            document.getElementById('storageUsage').textContent = 
              storageFree.toFixed(1) + '/' + storageTotal.toFixed(1) + ' GB free (' + (100 - storagePercent).toFixed(0) + '%)';
            
            // Active transcodes
            document.getElementById('activeTranscodes').textContent = data.active_transcodes + ' jobs';
            
            // Uptime
            const uptimeHours = data.uptime_hours;
            let uptimeText;
            if (uptimeHours < 1) {
              uptimeText = Math.round(uptimeHours * 60) + 'm';
            } else if (uptimeHours < 24) {
              uptimeText = uptimeHours.toFixed(1) + 'h';
            } else {
              uptimeText = Math.floor(uptimeHours / 24) + 'd ' + Math.round(uptimeHours % 24) + 'h';
            }
            document.getElementById('systemUptime').textContent = uptimeText;
            
            // Color coding based on usage
            const cpuEl = document.getElementById('cpuUsage');
            if (cpuPercent !== null && cpuPercent !== undefined) {
              if (cpuPercent > 80) {
                cpuEl.style.color = '#ef4444';
              } else if (cpuPercent > 50) {
                cpuEl.style.color = '#f59e0b';
              } else {
                cpuEl.style.color = '#10b981';
              }
            }
            
            const ramEl = document.getElementById('ramUsage');
            if (ramPercent > 85) {
              ramEl.style.color = '#ef4444';
            } else if (ramPercent > 70) {
              ramEl.style.color = '#f59e0b';
            } else {
              ramEl.style.color = '#10b981';
            }
            
            const storageEl = document.getElementById('storageUsage');
            if (storagePercent > 90) {
              storageEl.style.color = '#ef4444';
            } else if (storagePercent > 75) {
              storageEl.style.color = '#f59e0b';
            } else {
              storageEl.style.color = '#10b981';
            }
          })
          .catch(err => {
            console.error('Failed to fetch system info:', err);
            // Show error state
            document.getElementById('cpuUsage').textContent = 'Error';
            document.getElementById('ramUsage').textContent = 'Error';
            document.getElementById('storageUsage').textContent = 'Error';
          });
      }
      
      // Update on load
      updateSystemInfo();
      
      // Update every 5 seconds
      setInterval(updateSystemInfo, 5000);
    })();
  </script>
  
  {% block scripts %}{% endblock %}

</body>
</html>
